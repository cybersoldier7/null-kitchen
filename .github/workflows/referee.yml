name: referee

on:
  push:
    branches: [main]

jobs:
  taste-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install fastapi uvicorn
      - name: Run M1a and M1b tests
        run: python -m unittest discover -s tests -v
